plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"veinselect" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Automatisierte Tests im echten Client: gradlew runClientGameTest (Quellcode in src/gametest)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "veinselect-gametest"
		// Nur Client-Tests; Server-Gametests würden sonst bei jedem "gradlew build" mitlaufen
		enableGameTests = false
		enableClientGameTests = true
		// build/run/clientGameTest behalten, damit dort abgelegte Mods (Iris, Sodium) und Shader-Packs bleiben
		clearRunDirectory = false
	}
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Einstellungs-Button in Mod Menu
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
